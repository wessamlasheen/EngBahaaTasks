<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analog clock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="clock-page">
    <main class="clock" aria-label="Analog clock showing local time">
      <div class="clock-face">
        <ol class="clock-numbers" aria-hidden="true">
          <li><span>12</span></li>
          <li><span>1</span></li>
          <li><span>2</span></li>
          <li><span>3</span></li>
          <li><span>4</span></li>
          <li><span>5</span></li>
          <li><span>6</span></li>
          <li><span>7</span></li>
          <li><span>8</span></li>
          <li><span>9</span></li>
          <li><span>10</span></li>
          <li><span>11</span></li>
        </ol>
        <div class="clock-hands">
          <div class="clock-hand hour-hand"></div>
          <div class="clock-hand minute-hand"></div>
          <div class="clock-hand second-hand"></div>
        </div>
        <div class="clock-cap" aria-hidden="true"></div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
