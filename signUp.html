<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Wessam.dev</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      id="page-loader"
      class="page-loader"
      aria-live="polite"
      aria-busy="true"
    >
      <div class="loading-spinner">
        <span class="loading-spinner-dot"></span>
        <span class="loading-spinner-dot"></span>
        <span class="loading-spinner-dot"></span>
      </div>
    </div>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html">Wessam.dev</a>
        <nav aria-label="Main navigation">
          <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="cv.html">CV</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="signUp.html">Sign Up</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <section class="auth-card" aria-labelledby="signup-title">
        <h1 id="signup-title">Create Account</h1>
        <p>Join and start managing your frontend portfolio profile.</p>

        <form>
          <div class="form-group">
            <label for="signup-username">Username</label>
            <input
              type="text"
              id="signup-username"
              name="username"
              placeholder="Enter your username"
              required
            />
          </div>

          <div class="form-group">
            <label for="signup-password">Password</label>
            <input
              type="password"
              id="signup-password"
              name="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="form-group">
            <label for="signup-confirm-password">Confirm Password</label>
            <input
              type="password"
              id="signup-confirm-password"
              name="confirm_password"
              placeholder="Confirm your password"
              required
            />
          </div>

          <div class="form-group">
            <label for="signup-email">Email</label>
            <input
              type="email"
              id="signup-email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="signup-phone">Phone</label>
            <input
              type="tel"
              id="signup-phone"
              name="phone"
              placeholder="Enter your phone number"
              maxlength="11"
            />
          </div>

          <div class="form-group">
            <label for="signup-age">Age</label>
            <input
              type="number"
              name="age"
              id="signup-age"
              placeholder="Enter your age"
              required
              min="18"
              max="40"
            />
          </div>

          <div class="form-group">
            <label for="signup-profile-picture">Profile Picture</label>
            <input
              type="file"
              name="profile_picture"
              id="signup-profile-picture"
              required
              accept="image/png, image/jpeg, image/jpg"
            />
          </div>

          <fieldset class="gender-fieldset">
            <legend>Gender</legend>
            <label for="gender-male">
              <input
                type="radio"
                name="gender"
                id="gender-male"
                value="male"
                required
              />
              Male
            </label>
            <label for="gender-female">
              <input
                type="radio"
                name="gender"
                id="gender-female"
                value="female"
                required
              />
              Female
            </label>
          </fieldset>

          <button type="submit">Sign Up</button>
        </form>

        <p class="auth-switch">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </section>
    </main>
    <script src="page-loader.js" defer></script>
  </body>
</html>
